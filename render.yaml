services:
  - type: web
    name: meet-attendance-nbh
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_URL
        value: https://attendance-xgh0.onrender.com
      - key: GOOGLE_CREDENTIALS_B64
        sync: false   
